name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle with caching
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      env:
        SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      run: ./gradlew assembleRelease
      
    - name: Upload release APK to GoFile
      id: upload-release
      run: |
          FILE=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)

          if [ -z "$FILE" ]; then
            echo "::error::Release APK not found."
            exit 1
          fi

          RESPONSE=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            -F "file=@${FILE}" \
            https://upload.gofile.io/uploadfile)

          echo "$RESPONSE"

          URL=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')

          if [ -z "$URL" ]; then
            echo "::error::GoFile did not return a download URL."
            exit 1
          fi

          echo "Release APK: $URL"

          {
            echo "## 📦 APK Downloads"
            echo ""
            echo "### Release"
            echo "[Download Release APK]($URL)"
          } >> "$GITHUB_STEP_SUMMARY"
