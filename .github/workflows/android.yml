name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle with caching
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      env:
        SIGNING_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      run: ./gradlew assembleRelease
      
    - name: Upload Release APK as GitHub Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error

    - name: Upload release APK to GoFile
      id: upload-release
      run: |
          FILE=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)

          if [ -z "$FILE" ]; then
            echo "::error::Release APK not found."
            exit 1
          fi

          SERVERS=$(curl -s --retry 3 --retry-delay 2 https://api.gofile.io/servers | jq -r '.data.servers[].name // empty')
          URL=""

          for SERVER in $SERVERS; do
            echo "Attempting upload to GoFile server: $SERVER"
            RESPONSE=$(curl \
              --fail-with-body \
              --silent \
              --show-error \
              --retry 2 \
              --retry-delay 3 \
              -F "file=@${FILE}" \
              "https://${SERVER}.gofile.io/contents/uploadfile" 2>/dev/null) || true

            URL=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')
            if [ -n "$URL" ]; then
              echo "Upload successful: $URL"
              break
            fi
          done

          if [ -z "$URL" ]; then
            echo "::warning::GoFile upload failed across available servers."
            {
              echo "## 📦 APK Downloads"
              echo ""
              echo "Release APK available in **Workflow Artifacts** above."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release APK: $URL"
            {
              echo "## 📦 APK Downloads"
              echo ""
              echo "### Release"
              echo "[Download Release APK]($URL)"
              echo ""
              echo "*(Also available in **Workflow Artifacts** above)*"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
